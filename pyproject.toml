[project]
name = "starwars-autocalls"
version = "0.1.0"
description = "Add your description here"
authors = [
    { name = "Kiril Ivaylov Tzenkov", email = "kiril.ivaylov10@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.141.1",
    "jupyterlab>=4.6.3",
    "matplotlib>=3.11.1",
    "notebook>=7.6.2",
    "numpy>=2.5.2",
    "pandas>=3.0.5",
    "scikit-learn>=1.9.0",
    "seaborn>=0.13.2",
    "uvicorn>=0.52.4",
]

[project.scripts]
starwars-autocalls = "starwars_autocalls:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
